<div class="family-shell" :aria-busy="s.busy"><a class="skip" href="#family-content">Ir para conteúdo</a><header class="family-header"><a href="/" class="family-brand"><img v-if="identity.logo_url" :src="identity.logo_url" alt=""><span>{{identity.display_name}}<small>Portal do aluno e responsável</small></span></a><button v-if="s.account" class="btn" @click="logout" :disabled="s.busy">Sair</button></header><main id="family-content"><p v-if="!s.ready" role="status">Carregando seu espaço…</p><p v-if="s.error" class="alert error" role="alert">{{s.error}}</p><template v-if="s.ready&&!s.account"><section class="family-login panel"><p class="eyebrow">SEU ESPAÇO NA ESCOLA</p><h1>Aprendizado e cuidado, de perto.</h1><p>Acompanhe a vida escolar com seu acesso de aluno ou responsável.</p><form @submit.prevent="login"><label>E-mail de acesso<input type="email" v-model="s.email" required autocomplete="username"></label><label>Senha<input type="password" v-model="s.password" required autocomplete="current-password"></label><button class="btn btn-primary" :disabled="s.busy">Entrar</button></form><p>Primeiro acesso? Utilize o convite enviado ao e-mail do seu cadastro. Para recuperar seu acesso escolar, fale com a Secretaria.</p><a href="/online.html">Inscrição e matrícula online</a><p class="muted">A conta da inscrição é independente do acesso escolar.</p></section></template><section v-if="mfa.state.challenge" class="family-login panel"><!-- MFA-CHALLENGE --></section><template v-if="s.account"><div class="family-heading"><div><p class="eyebrow">BEM-VINDO AO SEU PORTAL</p><h1>Olá, {{s.account.name}}.</h1></div><label v-if="s.account.school_ids.length>1">Instituição<select v-model="s.schoolId" @change="changeSchool"><option v-for="id in s.account.school_ids" :value="id">{{id}}</option></select></label><label v-if="s.students.length">Aluno<select v-model="s.studentId" @change="changeStudent"><option v-for="item in s.students" :value="item.id">{{item.name}}</option></select></label></div><nav class="family-nav" aria-label="Seu portal"><button :aria-current="s.section==='academic'?'page':undefined" @click="section('academic')">Boletim e matrículas</button><button :aria-current="s.section==='documents'?'page':undefined" @click="section('documents')">Documentos</button><button :aria-current="s.section==='finance'?'page':undefined" @click="section('finance')">Financeiro</button><a href="/online.html">Inscrição e contratos ↗</a><button @click="run(load)" :disabled="s.busy">Atualizar</button></nav><section v-if="!s.students.length" class="panel"><h2>Nenhum aluno disponível</h2><p>A escola precisa vincular seu cadastro ao aluno e autorizar seu perfil. Um vínculo inativo não permite consultas.</p></section><template v-else-if="student()"><section v-if="s.section==='academic'"><article class="panel"><h2>{{student().name}}</h2><p>Código {{student().number}}</p><div class="family-grid"><div v-for="enrollment in student().enrollments" :key="enrollment.id"><strong>{{enrollment.class_name}}</strong><p>{{enrollment.year_name}} · {{enrollment.status}}</p><span>Matrícula {{enrollment.number}}</span></div></div><p v-if="!student().enrollments.length">Nenhuma matrícula disponível.</p></article><learning-portal :key="s.schoolId" :request="request" :download="download" :school-id="s.schoolId" /></section><section v-if="s.section==='documents'" class="panel"><h2>Documentos de {{student().name}}</h2><p>Documentos e pendências conferidos pela escola. Anexos da inscrição são enviados em Inscrição e contratos.</p><article v-for="file in student().documents" :key="file.id" class="family-line"><div><strong>{{file.type_name}}</strong><p>{{file.status}}</p></div><button v-if="file.file_id" class="btn" @click="document(file)" :disabled="s.busy">Baixar documento</button></article><p v-if="!student().documents.length">Nenhum documento disponível.</p></section><section v-if="s.section==='finance'" class="panel"><h2>Financeiro de {{student().name}}</h2><p v-if="!student().financial_authorized">Seu vínculo não autoriza a consulta financeira. Procure a escola se precisar revisar esta permissão.</p><template v-else><p>{{s.financeNote}}</p><article v-for="charge in s.charges" :key="charge.id" class="family-line"><div><strong>{{charge.description}}</strong><p>Vencimento: {{charge.due_on}} · {{charge.status}}</p></div><strong>R$ {{Number(charge.amount).toLocaleString('pt-BR',{minimumFractionDigits:2})}}</strong></article><p v-if="!s.charges.length">Nenhuma cobrança registrada para estas matrículas.</p></template></section></template></template></main><footer class="family-footer">{{identity.display_name}} · Atendimento pela Secretaria</footer></div>
