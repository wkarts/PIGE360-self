<div class="school-news-shell"><header class="school-news-header"><a class="school-news-brand" href="/news.html"><img v-if="identity.logo_url" :src="identity.logo_url" :alt="identity.display_name"><div><strong>{{identity.display_name}}</strong><small>Notícias e agenda da escola</small></div></a><div class="actions"><a class="btn btn-secondary" :href="'/online.html'+(state.schoolId?'?school='+encodeURIComponent(state.schoolId):'')">Portal dos responsáveis</a><a class="btn btn-primary" href="/">Acessar minha conta</a></div></header><main id="main-content"><p v-if="!state.ready" class="alert info" role="status">Carregando escola…</p><div v-else-if="state.error" class="alert error" role="alert">{{state.error}}<button class="btn btn-secondary" @click="start">Tentar novamente</button></div><template v-else><section v-if="state.schools.length>1" class="panel x-card"><label>Unidade escolar<select v-model="state.schoolId" @change="selectSchool"><option value="">Selecione uma unidade</option><option v-for="school in state.schools" :key="school.id" :value="school.id">{{school.name}}</option></select></label></section><school-community v-if="state.schoolId" :key="state.schoolId" :school-id="state.schoolId" :public-mode="true"></school-community><section v-else class="panel community-empty"><h1>{{state.schools.length?'Escolha sua unidade escolar':'Bem-vindo à escola'}}</h1><p>{{state.schools.length?'Selecione uma unidade para consultar as notícias e os próximos eventos.':'As notícias e a agenda serão disponibilizadas pela instituição.'}}</p></section></template></main><footer class="school-news-footer">{{identity.display_name}} · Informações oficiais da instituição.</footer></div>
