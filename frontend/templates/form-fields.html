            <div v-for="(f,index) in fieldGroup" :key="index+'-'+f.key" class="field" :class="{wide:f.wide, 'checkbox-field':f.type==='checkbox'}">
              <label v-if="f.type==='checkbox'" class="checkbox-label" :for="'modal-field-'+f.key"><input :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" type="checkbox"><span>{{ modalFieldLabel(f) }}</span></label>
              <template v-else>
                <label class="field-label" :for="'modal-field-'+f.key">{{ modalFieldLabel(f) }} <b v-if="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" class="required" aria-hidden="true">*</b><span v-if="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" class="sr-only"> (obrigatório)</span></label>
                <textarea v-if="f.type==='textarea'" :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" maxlength="4000" rows="3"></textarea>
                <template v-else-if="f.type==='select' || f.type==='multiselect'">
                  <select :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" :multiple="f.type==='multiselect'" :aria-describedby="f.type==='multiselect'?'modal-hint-'+f.key:undefined"><option v-if="f.type!=='multiselect'" value="">Selecione…</option><option v-for="o in f.options" :key="o.value" :value="o.value">{{ o.label }}</option></select>
                  <small v-if="f.type==='multiselect'" :id="'modal-hint-'+f.key" class="field-hint">Para selecionar mais de uma opção, use Ctrl ou ⌘ no computador.</small>
                </template>
                <div v-else-if="f.type==='student'" class="field-lookup" :aria-busy="state.studentSearchBusy">
                  <input type="search" :value="state.studentSearchQuery" placeholder="Busque por nome ou número" aria-label="Filtrar alunos" :aria-describedby="'modal-hint-'+f.key" autocomplete="off" @input="state.modal.form[f.key]='';searchStudents($event.target.value)" @keydown.enter.prevent>
                  <select :id="'modal-field-'+f.key" :aria-label="modalFieldLabel(f)" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" :aria-describedby="'modal-hint-'+f.key"><option value="">Selecione o aluno…</option><option v-for="s in state.studentChoices" :key="s.id" :value="s.id">{{ s.person.name }} · {{ s.number }}</option></select>
                  <small :id="'modal-hint-'+f.key" class="field-hint" role="status" aria-live="polite">{{ state.studentSearchMessage }}</small>
                </div>
                <div v-else-if="f.type==='person'" class="field-lookup" :aria-busy="state.personSearchBusy">
                  <input type="search" :value="state.personSearchQuery" placeholder="Busque por nome ou CPF" aria-label="Filtrar pessoas" :aria-describedby="'modal-hint-'+f.key" autocomplete="off" @input="state.modal.form[f.key]='';searchPersons($event.target.value)" @keydown.enter.prevent>
                  <select :id="'modal-field-'+f.key" :aria-label="modalFieldLabel(f)" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" :aria-describedby="'modal-hint-'+f.key"><option value="">Selecione a pessoa…</option><option v-for="p in state.personChoices" :key="p.id" :value="p.id">{{ p.name }} · {{ cpf(p.cpf) }}</option></select>
                  <small :id="'modal-hint-'+f.key" class="field-hint" role="status" aria-live="polite">{{ state.personSearchMessage }}</small>
                </div>
                <input v-else-if="f.type==='identity-logo' || f.type==='identity-font'" :id="'modal-field-'+f.key" type="file" :accept="f.type==='identity-font'?'.ttf,.woff2':'.png,.jpg,.jpeg,.webp'" @change="identityFileChange($event,f.key)">
                <input v-else-if="f.type==='user-photo'" :id="'modal-field-'+f.key" type="file" accept=".png,.jpg,.jpeg,.webp" @change="myPhotoChange">
                <input v-else-if="f.type==='photo'" :id="'modal-field-'+f.key" type="file" accept=".png,.jpg,.jpeg" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" @change="fileChange">
                <input v-else-if="f.type==='file'" :id="'modal-field-'+f.key" type="file" accept=".pdf,.png,.jpg,.jpeg" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" @change="fileChange">
                <input v-else :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" :type="f.type" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" :min="f.type==='number'?(f.key==='workload_hours'?0:1):undefined" :minlength="f.type==='password' && f.key!=='current_password'?12:undefined" :maxlength="f.type==='password'?128:400" :inputmode="['cpf','cep','postal_code'].includes(f.key)?'numeric':f.type==='tel'?'tel':f.type==='email'?'email':undefined" :autocomplete="f.type==='password'?(f.key==='current_password'?'current-password':'new-password'):'off'">
              </template>
            </div>
