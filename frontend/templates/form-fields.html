            <label v-for="(f,index) in fieldGroup" :key="index+'-'+f.key" :for="'modal-field-'+f.key" class="field" :class="{wide:f.wide, 'checkbox-field':f.type==='checkbox'}">
              <template v-if="f.type==='checkbox'"><input :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" type="checkbox">{{ modalFieldLabel(f) }}</template>
              <template v-else><span>{{ modalFieldLabel(f) }} <b v-if="f.required" class="required">*</b></span>
                <textarea v-if="f.type==='textarea'" :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" maxlength="4000" rows="3"></textarea>
                <select v-else-if="f.type==='select' || f.type==='multiselect'" :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" :multiple="f.type==='multiselect'"><option v-if="f.type!=='multiselect'" value="">Selecione…</option><option v-for="o in f.options" :key="o.value" :value="o.value">{{ o.label }}</option></select>
                <template v-else-if="f.type==='student'"><input type="search" :value="state.studentSearchQuery" placeholder="Nome ou número do aluno…" aria-label="Filtrar alunos" autocomplete="off" @input="state.modal.form[f.key]='';searchStudents($event.target.value)" @keydown.enter.prevent><select :id="'modal-field-'+f.key" :aria-label="f.label" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))"><option value="">Selecione o aluno…</option><option v-for="s in state.studentChoices" :key="s.id" :value="s.id">{{ s.person.name }} · {{ s.number }}</option></select><small role="status" aria-live="polite">{{state.studentSearchMessage}}</small></template>
                <template v-else-if="f.type==='person'"><input type="search" :value="state.personSearchQuery" placeholder="Digite nome ou CPF…" aria-label="Filtrar pessoas" autocomplete="off" @input="state.modal.form[f.key]='';searchPersons($event.target.value)" @keydown.enter.prevent><select :id="'modal-field-'+f.key" :aria-label="f.label" v-model="state.modal.form[f.key]" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))"><option value="">Selecione a pessoa…</option><option v-for="p in state.personChoices" :key="p.id" :value="p.id">{{ p.name }} · {{ cpf(p.cpf) }}</option></select><small role="status" aria-live="polite">{{state.personSearchMessage}}</small><small>Digite pelo menos 2 caracteres. A busca é limitada e você precisa selecionar a identidade antes de continuar.</small></template>
                <input v-else-if="f.type==='identity-logo' || f.type==='identity-font'" :id="'modal-field-'+f.key" type="file" :accept="f.type==='identity-font'?'.ttf,.woff2':'.png,.jpg,.jpeg,.webp'" @change="identityFileChange($event,f.key)"><input v-else-if="f.type==='user-photo'" :id="'modal-field-'+f.key" type="file" accept=".png,.jpg,.jpeg,.webp" @change="myPhotoChange"><input v-else-if="f.type==='photo'" :id="'modal-field-'+f.key" type="file" accept=".png,.jpg,.jpeg" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" @change="fileChange"><input v-else-if="f.type==='file'" :id="'modal-field-'+f.key" type="file" accept=".pdf,.png,.jpg,.jpeg" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" @change="fileChange">
                <input v-else :id="'modal-field-'+f.key" v-model="state.modal.form[f.key]" :type="f.type" :required="f.required || (f.key==='birth_date' && selectedPersonTypes().includes('student'))" :min="f.type==='number'?(f.key==='workload_hours'?0:1):undefined" :minlength="f.type==='password' && f.key!=='current_password'?12:undefined" :maxlength="f.type==='password'?128:400" :autocomplete="f.type==='password'?'new-password':'off'">
              </template>
            </label>
