name: Aplicar melhoria revisada da navegação
on:
  push:
    branches: [fix/workspace-navigation]
    paths:
      - 'scripts/ci/workspace-patch.*'
      - '.github/workflows/apply-workspace.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verificar integridade e aplicar a alteração revisada
        env:
          EXPECTED_BRANCH: fix/workspace-navigation
        run: |
          python - <<'PY'
          import gzip, hashlib, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == os.environ['EXPECTED_BRANCH']
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == '24b3711187e540ae401eb2ff03d77e30c69280fb', parent
          compressed = b''.join(Path(f'scripts/ci/workspace-patch.{i}').read_bytes() for i in range(6))
          assert len(compressed) == 15985
          patch = gzip.decompress(compressed)
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'e06933c24a1a81a55007fc8eea7cba7bca2eb547e3a70062a93bcfb5b85e0fcd', digest
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          print('Patch verificado:', digest)
          PY
      - name: Compilar frontend e verificar os renders
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      - name: Registrar apenas código com a permissão de contents
        run: |
          # O token deste job não altera workflows. A configuração de CI é aplicada pela conexão autorizada.
          git restore --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/NAVEGACAO-E-ROLAGEM.md frontend/public/index.html frontend/public/ui-icons.svg frontend/public/workspace.css frontend/src/workspace.ts frontend/templates/app.html frontend/tsconfig.json scripts/e2e-workspace.py scripts/ui_bridge.py frontend/dist
          git rm scripts/ci/workspace-patch.[0-5]
          git commit -m 'fix(ui): manter marca e cabeçalho fixos com navegação consistente'
          git push origin HEAD:fix/workspace-navigation
