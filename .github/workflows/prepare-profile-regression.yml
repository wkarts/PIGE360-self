name: Verificar edição de perfil sem foto
on:
  push:
    branches: [feature/white-label-embed-profile]
    paths: ['.github/workflows/prepare-profile-regression.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wkarts/PIGE360-self'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Aplicar correção pontual e seu teste
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'feature/white-label-embed-profile'
          path = Path('frontend/src/app.ts')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '9b73b53ad13f68b083b018902e6e5f38b69d583cb9ac381d297b44b1b0e3456c'
          before = "clearProfilePreview();openModal('my-profile','Meu perfil',fields,valuesFrom(row,fields),row);"
          after = "clearProfilePreview();openModal('my-profile','Meu perfil',fields,{...valuesFrom(row,fields),remove_photo:false},row);"
          source = path.read_text(); assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'f1a6032b024e25b39e581436292315838223b3fe92a1360176f00fb04de4e568'
          path = Path('scripts/e2e-whitelabel.py')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '60dfea402ef8757f51e4d931668dcb5b45fe93ae55a0e95fc5731dd30143b39e'
          before = "        dialog.get_by_label('Foto do usuário',exact=False).set_input_files({'name':'perfil.png','mimeType':'image/png','buffer':image})"
          added = [
              "        dialog.get_by_role('button',name='Salvar',exact=True).click();expect(dialog).to_have_count(0)",
              "        expect(page.locator('.user-caption strong')).to_have_text('Secretaria Atualizada')",
              "        record('Perfil salvo sem enviar foto: campos opcionais preservam o contrato booleano')",
              "        page.get_by_role('button',name='Meu perfil',exact=True).click();dialog=page.get_by_role('dialog')",
          ]
          source = path.read_text(); assert source.count(before) == 1
          path.write_text(source.replace(before, '\n'.join(added)+'\n'+before))
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '6c4abc38c8535e42db18dc3e9c49a1530dc3dc41c104a97464a6ec4c448a54ac'
          PY
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          python -m py_compile scripts/e2e-whitelabel.py
      - name: Registrar alteração somente na branch da PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/app.ts frontend/dist scripts/e2e-whitelabel.py
          git commit -m 'fix(perfil): salvar dados sem obrigar envio ou remoção de foto'
          git push origin HEAD:feature/white-label-embed-profile
