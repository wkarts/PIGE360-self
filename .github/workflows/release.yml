name: Main - Release SemVer e GHCR estável
run-name: 'PIGE360 stable | ${{ inputs.promotion_run || github.run_id }} | ${{ inputs.target_sha || github.event.pull_request.merge_commit_sha || github.sha }}'
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: Incremento após a primeira release numérica
        type: choice
        default: patch
        options: [patch, minor, major]
      target_sha:
        description: SHA exato de main (vazio usa o SHA do evento)
        type: string
        default: ''
      promotion_pr:
        description: PR develop para main já mesclada (opcional)
        type: string
        default: ''
      promotion_run:
        description: Correlação da promoção automática (opcional)
        type: string
        default: ''
permissions:
  contents: read
  packages: write
concurrency:
  group: pige360-stable-release
  cancel-in-progress: false
jobs:
  version:
    permissions:
      contents: read
      pull-requests: read
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.title, 'release('))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate: ${{ steps.version.outputs.candidate_tag }}
      sha: ${{ steps.version.outputs.target_sha }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          # O verificador vem do SHA do evento main, nunca do input de dispatch.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Conferir SHA atual de main e PR de origem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.merge_commit_sha || github.sha }}
          PROMOTION_PR: ${{ inputs.promotion_pr }}
          TRUSTED_EVENT_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: python scripts/ci/auto_promotion.py verify-release
      - id: version
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/ci/version.py release
      - name: Não republicar release concluída do mesmo commit
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        run: python scripts/ci/release_state.py state --version "$VERSION" --sha "$TARGET_SHA"
  verify_published:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar release existente sem republicar ou rebaixar aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ needs.version.outputs.sha }}
        run: python scripts/ci/release_state.py verify --version "$VERSION" --sha "$TARGET_SHA"
  bases:
    needs: version
    if: needs.version.outputs.published != 'true'
    uses: ./.github/workflows/container-bases.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
  tests:
    needs: [version, bases]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      node_ref: ${{ needs.bases.outputs.node_ref }}
      python_ref: ${{ needs.bases.outputs.python_ref }}
      postgres_ref: ${{ needs.bases.outputs.postgres_ref }}
  candidate:
    needs: [version, tests, bases]
    uses: ./.github/workflows/publish-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      version: ${{ needs.version.outputs.version }}
      candidate: ${{ needs.version.outputs.candidate }}
      channel: release
      node_ref: ${{ needs.bases.outputs.node_ref }}
      python_ref: ${{ needs.bases.outputs.python_ref }}
      postgres_ref: ${{ needs.bases.outputs.postgres_ref }}
  release:
    needs: [version, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pige360-ghcr-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recuperar as bases imutáveis usadas nesta execução
        uses: actions/download-artifact@v4
        with:
          name: base-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence
      - name: Release, checkpoint e promoção por digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ needs.version.outputs.sha }}
          IMAGE: ${{ needs.candidate.outputs.image }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          MAIL_AGENT_IMAGE: ghcr.io/wkarts/pige360-self-mail-agent
          MAIL_AGENT_DIGEST: ${{ needs.candidate.outputs.mail_agent_digest }}
          SOGO_IMAGE: ghcr.io/wkarts/pige360-self-sogo
          SOGO_DIGEST: ${{ needs.candidate.outputs.sogo_digest }}
          WEBSITE_IMAGE: ghcr.io/wkarts/pige360-self-website
          WEBSITE_DIGEST: ${{ needs.candidate.outputs.website_digest }}
        run: bash scripts/ci/finalize-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ needs.version.outputs.version }}-${{ github.run_attempt }}
          path: release/
          retention-days: 30
