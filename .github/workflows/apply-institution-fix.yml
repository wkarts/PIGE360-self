name: Aplicar correção institucional validada
on:
  push:
    branches: [feat/connect-api-instance-management]
    paths:
      - 'scripts/maintenance/institution.patch.gz.*'
permissions:
  contents: write
concurrency:
  group: pige360-institution-repair
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wkarts/PIGE360-self' && github.ref == 'refs/heads/feat/connect-api-instance-management'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verificar integridade e aplicar patch revisado
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import hashlib
          import subprocess
          raw = b''.join(Path(f'scripts/maintenance/institution.patch.gz.{n}').read_bytes() for n in range(3))
          assert hashlib.sha256(raw).hexdigest() == '0bd9e11a49c39ee952543658d3b870819bf6994b307d6636b34ec854641fb146', 'Transporte divergente'
          patch = gzip.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == '3f17a4b1f5ebad93497b102e1e19f34845eaedb87c1d50d7d64e396829b90b2f', 'Patch divergente'
          target = Path('/tmp/pige360-institution.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          PY
      - name: Recompilar e verificar frontend
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          git add frontend/dist
          git diff --cached --check
      - name: Registrar somente na branch da correção
        run: |
          current="$(git ls-remote origin refs/heads/feat/connect-api-instance-management | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: corrigir Cadastro Único e identidade institucional da escola'
          git push origin HEAD:refs/heads/feat/connect-api-instance-management
