name: GHCR - Bases e servicos sob demanda
on:
  workflow_call:
    inputs:
      ref: {type: string, default: ''}
      force:
        type: boolean
        default: false
      refresh_upstream:
        type: boolean
        default: false
    outputs:
      python_ref: {value: '${{ jobs.publish.outputs.python_ref }}'}
      node_ref: {value: '${{ jobs.publish.outputs.node_ref }}'}
      postgres_ref: {value: '${{ jobs.publish.outputs.postgres_ref }}'}
  workflow_dispatch:
    inputs:
      refresh_upstream:
        description: Consultar upstream e atualizar somente se o digest ou as dependencias mudaram
        type: boolean
        default: false
  schedule:
    - cron: '31 4 * * 1'
permissions:
  contents: read
  packages: write
concurrency:
  group: pige360-self-ghcr-bases
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      python_ref: ${{ steps.bases.outputs.python_ref }}
      node_ref: ${{ steps.bases.outputs.node_ref }}
      postgres_ref: ${{ steps.bases.outputs.postgres_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reutilizar ou construir bases por fingerprint
        id: bases
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh_upstream == true || inputs.force == true }}
        run: |
          args=()
          if [[ "$REFRESH" == true ]]; then args+=(--refresh-upstream); fi
          python scripts/ci/base_images.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: base-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/base-images.lock.json
          retention-days: 30
          overwrite: true
