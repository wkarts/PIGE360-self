name: Aplicar cadastros e modais revisados
on:
  push:
    branches: [feature/cadastros-modais]
    paths: ['.delivery/cadastres.part-*', '.github/workflows/apply-cadastres.yml']
permissions:
  contents: write
concurrency:
  group: apply-cadastres-reviewed
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wkarts/PIGE360-self' && github.ref == 'refs/heads/feature/cadastros-modais'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cadastros-modais
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verificar hashes e aplicar exclusivamente o delta revisado
        shell: bash
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          raw=b''.join(Path(f'.delivery/cadastres.part-{i:02}').read_bytes() for i in range(1,5))
          assert hashlib.sha256(raw).hexdigest() == '1628363427258fdfef9f7025ce6247db2930f31a205e50063c11fc804953431d', 'Delta corrompido'
          allowed=set('''.github/workflows/ci.yml backend/app/business_people.py backend/app/main.py backend/app/models.py backend/app/people.py backend/app/schemas.py backend/migrations/versions/0011_person_cadastres.py backend/tests/test_business_people.py docs/CADASTROS-E-MODAIS.md frontend/src/api.ts frontend/src/app.css frontend/src/app.ts frontend/src/dialogs.ts frontend/src/expansion.ts frontend/src/vue-globals.d.ts frontend/templates/app.html frontend/templates/expansion.html frontend/tsconfig.json scripts/e2e-cadastres.py scripts/e2e.py'''.split())
          payload=json.loads(gzip.decompress(raw))
          assert {x['path'] for x in payload} == allowed and len(payload) == len(allowed)
          outputs=[]
          for item in payload:
              path=Path(item['path'])
              assert not path.is_symlink() and all(not p.is_symlink() for p in path.parents)
              current=path.read_bytes() if path.exists() else None
              before=hashlib.sha256(current).hexdigest() if current is not None else None
              assert before == item['before'], f'Base divergente: {path}'
              text=(current or b'').decode('utf-8')
              end=0
              for i,j,value in item['edits']:
                  assert end <= i <= j <= len(text)
                  end=j
              for i,j,value in reversed(item['edits']): text=text[:i]+value+text[j:]
              result=text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['after'], f'Resultado divergente: {path}'
              outputs.append((path,result))
          for path,result in outputs:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
              print('Verificado:', path)
          PY
      - name: Compilar fontes e verificar modais
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          python -m compileall -q backend/app backend/migrations scripts
      - name: Registrar somente código e compilados na branch da melhoria
        run: |
          git restore .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend/src frontend/templates frontend/tsconfig.json frontend/dist scripts/e2e.py scripts/e2e-cadastres.py docs/CADASTROS-E-MODAIS.md
          git diff --cached --check
          git commit -m 'feat(cadastros): fichas por vínculo e modais responsivos de cadastro e cobrança'
          git push origin HEAD:refs/heads/feature/cadastros-modais
