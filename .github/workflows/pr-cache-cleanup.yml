name: Cache - PR encerrado
on:
  pull_request_target:
    branches: [main, develop]
    types: [closed]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Nunca faz checkout nem executa código da branch do PR, inclusive forks.
      - uses: actions/checkout@v6
        with: {ref: main, persist-credentials: false}
      - name: Remover somente caches refs/pull/NUMERO/merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ci/cleanup.py cache --apply --pr-ref "refs/pull/$PR_NUMBER/merge"
