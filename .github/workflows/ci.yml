name: CI - FastAPI, Vue PWA e Docker
on:
  workflow_call:
    inputs:
      ref: {type: string, required: false, default: ''}
      node_ref: {type: string, default: 'ghcr.io/wkarts/pige360-self-base-node:22-alpine'}
      python_ref: {type: string, default: 'ghcr.io/wkarts/pige360-self-base-python:3.13-slim'}
      postgres_ref: {type: string, default: 'ghcr.io/wkarts/pige360-self-postgres:17-bookworm'}
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ inputs.postgres_ref || 'ghcr.io/wkarts/pige360-self-postgres:17-bookworm' }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: pige_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: pige_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pige_test -d pige_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Preparar evidências limpas
        run: |
          rm -rf ci-evidence evidence/0.3.0
          mkdir -p ci-evidence
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Motor local de leitura (mesmas ferramentas da imagem)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por tesseract-ocr-eng poppler-utils
      - name: Dependências reproduzíveis
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Políticas de CI, sintaxe e frontend
        run: |
          python -m unittest discover -s tests/ci -v
          python -m compileall -q backend/app backend/migrations scripts
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          node --check frontend/dist/sw.js
          python scripts/ci/validate.py
      - name: Testes FastAPI com PostgreSQL real
        working-directory: backend
        env:
          PIGE_TEST_DATABASE_URL: postgresql+psycopg://pige_test:disposable-test-password@127.0.0.1:5432/pige_test
          PYTHONPATH: .
        run: python -m pytest -q --junitxml=../ci-evidence/postgresql-tests.xml
      - name: E2E HTTP no Chromium (sem bridge)
        run: |
          python -m playwright install --with-deps chromium
          python scripts/e2e.py
          python scripts/e2e-online.py
          python scripts/e2e-cadastres.py
          python scripts/e2e-workspace.py
          python scripts/e2e-whitelabel.py
          python scripts/e2e-access.py
          python scripts/e2e-assisted.py
      - name: Reunir somente evidências E2E novas
        if: always()
        run: |
          mkdir -p ci-evidence/browser
          if [[ -d evidence/0.3.0 ]]; then cp -a evidence/0.3.0/. ci-evidence/browser/; fi
          # Checkpoint sanitizado do código efetivamente testado; sem .env real ou fontes.
          python scripts/ci/package.py --version "$(cat VERSION)" --commit "$(git rev-parse HEAD)" --output ci-evidence/checkpoint/PIGE360-Self-source.zip
      - name: Docker Compose e teste de inicialização
        env:
          NODE_BASE_IMAGE: ${{ inputs.node_ref || 'ghcr.io/wkarts/pige360-self-base-node:22-alpine' }}
          PYTHON_BASE_IMAGE: ${{ inputs.python_ref || 'ghcr.io/wkarts/pige360-self-base-python:3.13-slim' }}
          POSTGRES_IMAGE: ${{ inputs.postgres_ref || 'ghcr.io/wkarts/pige360-self-postgres:17-bookworm' }}
        run: |
          python scripts/configure.py --env-file deploy/docker/.env.ci
          docker compose --env-file deploy/docker/.env.ci -f deploy/docker/compose.yaml config --quiet
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" \
            --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" \
            --build-arg POSTGRES_IMAGE="$POSTGRES_IMAGE" -t pige360-self:ci .
          bash scripts/ci/smoke.sh pige360-self:ci local
          python - <<'PY'
          import json
          from pathlib import Path
          tested = json.loads(Path('frontend/dist/build-info.json').read_text())
          packaged = json.loads(Path('ci-evidence/docker-smoke.json').read_text())['frontend']
          assert packaged['version'] == Path('VERSION').read_text().strip(), packaged
          assert packaged['build_id'] == tested['build_id'], (packaged, tested)
          PY
      - name: Evidências desta execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: warn
