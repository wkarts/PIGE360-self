name: Preparar código revisado de iframe e perfil
on:
  push:
    branches: [feature/white-label-embed-profile]
    paths:
      - 'scripts/ci/iframe-publication/**'
      - '.github/workflows/prepare-iframe-profile.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wkarts/PIGE360-self'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Aplicar fontes revisados com verificação integral
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'feature/white-label-embed-profile'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == 'a837f45287e47351cf283afa6efcfda2746f7bbc'
          root = Path('scripts/ci/iframe-publication')
          patch = b''.join((root / f'reviewed.{i}.patchpart').read_bytes() for i in range(11))
          assert len(patch) == 164476
          assert hashlib.sha256(patch).hexdigest() == 'ccc23d04f99380568ed5b5233555470c62ac8e87a77fc6b5cc160fb31d604a48'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          expected = json.loads((root/'expected-source.json').read_text())
          for name, digest in expected.items():
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          print(f'{len(expected)} arquivos-fonte conferidos contra o checkpoint entregue.')
          PY
      - name: Compilar frontend e verificar sintaxe
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          python -m compileall -q backend/app backend/migrations scripts
      - name: Registrar fontes e compilados na branch da melhoria
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names = json.loads(Path('scripts/ci/iframe-publication/expected-source.json').read_text())
          files = [p for p in names if not p.startswith('.github/')]
          subprocess.run(['git','add','--',*files,'frontend/dist'], check=True)
          subprocess.run(['git','rm','-r','--','scripts/ci/iframe-publication'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: identidade escolar, incorporação autorizada e perfil com foto'
          git push origin HEAD:feature/white-label-embed-profile
