name: Preparar correções revisadas de acesso e cadastro
on:
  push:
    branches: [feature/acesso-seguranca-cadastro]
    paths: ['.github/workflows/prepare-access.yml', 'scripts/ci/consolidated-patch.*']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verificar e aplicar o patch revisado
        run: |
          python - <<'PY'
          import gzip, hashlib, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'feature/acesso-seguranca-cadastro'
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          assert parent == '1102da3d632b228f73faed221e9435989c85285d', parent
          compressed = b''.join(Path(f'scripts/ci/consolidated-patch.{i}').read_bytes() for i in range(9))
          assert len(compressed) == 50958
          patch = gzip.decompress(compressed)
          assert len(patch) == 202968
          assert hashlib.sha256(patch).hexdigest() == 'bfcb8aa6d65bfeb5f5963eea90c3a3631bd6120c7354b93c09a192eb20978187'
          args = ['git', 'apply', '--unidiff-zero', '--exclude=.github/workflows/ci.yml']
          subprocess.run([*args, '--check', '-'], input=patch, check=True)
          subprocess.run([*args, '-'], input=patch, check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--','.github'], text=True).strip()
          PY
      - name: Compilar frontend e validar sintaxe
        run: |
          python -m compileall -q backend/app backend/migrations scripts
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      - name: Registrar fontes e compilados na branch da melhoria
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTS.md backend docs/ACESSO-CADASTRO-2FA.md frontend scripts tests/ci/test_registry_cli.py
          git rm scripts/ci/consolidated-patch.[0-8]
          git diff --cached --name-only | grep -E '(^|/)(\.env$|node_modules/)|\.(ttf|woff2?|otf)$' && exit 1 || true
          git commit -m 'feat(escola): corrigir iframe e GHCR, simplificar cadastro e incluir 2FA institucional'
          git push origin HEAD:feature/acesso-seguranca-cadastro
