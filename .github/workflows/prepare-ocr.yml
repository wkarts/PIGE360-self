name: Aplicar fontes revisados de OCR e consultas
on:
  push:
    branches: [feature/ocr-consultas-cadastrais]
    paths: ['.github/workflows/prepare-ocr.yml', 'scripts/ci/ocr-patch.*']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verificar base e integridade dos fontes
        run: |
          python - <<'PY'
          import hashlib, lzma, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'feature/ocr-consultas-cadastrais'
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          assert parent == '9e10597a5ed5f891e8055670cc6de17728d2005e', parent
          packed = b''.join(Path(f'scripts/ci/ocr-patch.{i}').read_bytes() for i in range(10))
          assert len(packed) == 44920
          patch = lzma.decompress(packed)
          assert len(patch) == 187331
          assert hashlib.sha256(patch).hexdigest() == '2043e041fd8a20a4a28abf4de699fc57ab0f49807f0e47c42c90a5abe9b7259d'
          subprocess.run(['git','apply','--unidiff-zero','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'], input=patch, check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--','.github'], text=True).strip()
          PY
      - name: Compilar frontend e verificar sintaxe
        run: |
          python -m compileall -q backend/app backend/migrations scripts
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      - name: Registrar implementação na branch de trabalho
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Dockerfile backend containers/base-python.Dockerfile deploy frontend scripts/ci/smoke.sh scripts/start.sh scripts/ui_bridge.py scripts/e2e-assisted.py tests/ci/test_assisted_layout.py docs/OCR-E-CONSULTAS-CADASTRAIS.md
          git rm scripts/ci/ocr-patch.[0-9]
          if git diff --cached --name-only | grep -E '(^|/)(\.env$|node_modules/)|\.(ttf|woff2?|otf)$'; then exit 1; fi
          git diff --cached --check
          git commit -m 'feat(escola): OCR local em worker separado e consultas CNPJ e CEP'
          git push origin HEAD:feature/ocr-consultas-cadastrais
